<!doctype html>
<!-- 1200 x 630 social preview. Render with the site's real Polybot screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../assets/fonts/space-grotesk-latin-variable.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { position: relative; color: #f2f6ff; background: radial-gradient(ellipse at 79% 41%, #184f9c53, transparent 61%), #080f1e; font-family: "Segoe UI Variable", "Aptos", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .signal { position: absolute; inset: 0; width: 1200px; height: 630px; color: #63a9ff; opacity: .34; mask-image: linear-gradient(90deg, transparent 33%, #000 62%); }
  .signal path:nth-child(2n) { stroke: #a3d9ff; }
  .signal path:nth-child(3n) { opacity: .5; }
  .brand { position: absolute; top: 38px; left: 58px; display: flex; align-items: center; gap: 12px; color: #f2f6ff; font: 650 23px/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; }
  .brand img { width: 39px; height: 39px; border-radius: 9px; }
  .brand span { color: #b5c4db; font-weight: 400; }
  .copy { position: absolute; top: 178px; left: 58px; width: 520px; }
  h1 { max-width: 8ch; margin: 0; font: 500 73px/.99 "Space Grotesk", sans-serif; letter-spacing: -.04em; }
  h1 span { color: #91c5ff; }
  .copy p { max-width: 37ch; margin: 28px 0 0; color: #b5c4db; font-size: 17px; line-height: 1.6; }
  .copy p strong { color: #f2f6ff; font-weight: 650; }
  .availability { position: absolute; bottom: 48px; left: 58px; display: flex; align-items: center; gap: 10px; color: #9eafca; font-size: 13px; }
  .availability::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #91c5ff; }
  .stage { position: absolute; left: 625px; top: 118px; width: 650px; padding: 12px 12px 11px; border-radius: 12px; background: #12223b; box-shadow: 0 42px 90px #0008; transform: perspective(1400px) rotateY(-7deg) rotateZ(1deg); transform-origin: left center; }
  .stage-top { display: flex; align-items: center; justify-content: space-between; height: 39px; margin-bottom: 9px; font: 500 13px/1 "Space Grotesk", sans-serif; }
  .stage-top span:first-child { display: flex; align-items: center; gap: 8px; }
  .stage-top img { width: 23px; height: 23px; border-radius: 6px; }
  .stage-top small { color: #9eafca; font-size: 11px; }
  .stage > img { display: block; width: 100%; border-radius: 6px; }
  .stage-bottom { padding: 12px 1px 1px; color: #b5c4db; font-size: 11px; }
</style>
</head>
