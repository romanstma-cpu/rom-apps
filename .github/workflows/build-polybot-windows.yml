name: Build ROM Polybot for Windows

on:
  push:
    branches: [main, claude/polymarket-bot-remake-leqf54]
    paths: ["polybot/**", ".github/workflows/build-polybot-windows.yml"]
    tags: ["polybot-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: polybot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build ROM-Polybot.exe
        run: >
          pyinstaller --onefile --name ROM-Polybot
          --icon windows/rom.ico
          --add-data "config.example.yaml;."
          windows/polybot_win.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ROM-Polybot.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ROM-Polybot.exe" | Out-File -Encoding ascii dist/SHA256SUMS-polybot.txt
          Get-Content dist/SHA256SUMS-polybot.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Polybot-windows
          path: |
            polybot/dist/ROM-Polybot.exe
            polybot/dist/SHA256SUMS-polybot.txt

      # A tag push publishes the download the website links to.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/polybot-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ROM Polybot ${GITHUB_REF_NAME#polybot-v}" \
            --notes "Built by CI from the tagged commit. Verify the download against \`SHA256SUMS-polybot.txt\`. Paper mode by default — live trading needs your own keys and an explicit switch." \
            dist/ROM-Polybot.exe dist/SHA256SUMS-polybot.txt
