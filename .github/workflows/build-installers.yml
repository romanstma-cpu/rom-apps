name: Build Installers

# Builds the Apple Silicon installer and publishes it as an asset on a per-run
# GitHub *prerelease*. Release assets do not count against Actions artifact
# storage and do not expire. This workflow does not wire up auto-update.
#
# The Python backend is frozen with PyInstaller on a native Apple Silicon
# runner. The packaged backend and app are tested before release.
on:
  push:
    branches: [main, build, codex/polybot-macos]
  workflow_dispatch: {}

# contents: write is required to create the release and upload installer assets.
permissions:
  contents: write

jobs:
  build:
    name: mac-apple-silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build app, bundle backend, package installer
        shell: bash
        run: |
          npm run build
          npm run py:dist
          npx electron-builder --mac dmg --arm64
        env:
          # Build the macOS app unsigned — no Apple Developer cert/secrets needed.
          # electron-builder ad-hoc signs arm64 so it still launches (right-click
          # > Open the first time). No-op on Linux/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged backend and installer
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name 'ROM PolyBot.app' -type d | head -1)
          test -n "$APP"
          "$APP/Contents/Resources/python/rom-polybot-backend" --selftest
          node scripts/mac-smoke.mjs "$APP/Contents/MacOS/ROM PolyBot"
          if compgen -G "release/*.dmg" > /dev/null; then
            hdiutil verify release/*.dmg
          fi
          FILE=$(find release -maxdepth 1 -name '*-arm64.dmg' -type f | head -1)
          test -n "$FILE"
          shasum -a 256 "$FILE" > release/SHA256SUMS-mac-apple-silicon.txt

      # Publish the Apple Silicon disk image as an asset on a per-run prerelease.
      # Release assets are exempt
      # from the Actions artifact storage quota that was failing uploads before.
      - name: Publish installers to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polybot-mac-${{ github.run_number }}
          name: CI build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: >
            Unsigned Apple Silicon installer built from ${{ github.sha }}.
            macOS may require right-click → Open the first time; the arm64 app
            is ad-hoc signed but is not Apple-notarized.
          files: |
            release/*-arm64.dmg
            release/SHA256SUMS-mac-apple-silicon.txt
